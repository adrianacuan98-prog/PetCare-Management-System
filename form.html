{% extends 'base.html' %}{% block content %}<p class="eyebrow">{{config.title|upper}}</p><h1>{{action}} {{config.title[:-1] if config.title.endswith('s') else config.title}}</h1><form method="post" class="panel">{% for name,label,kind in config.fields %}<label>{{label}}{% if action=='Update' and name==config.pk %}<input value="{{record[name]}}" disabled>{% elif kind=='select' %}<select name="{{name}}" required><option value="">Select {{label|lower}}</option>{% for option in choices[name] %}<option value="{{option.id}}" {% if record.get(name)|string == option.id|string %}selected{% endif %}>{{option.label}} (ID {{option.id}})</option>{% endfor %}</select>{% else %}<input name="{{name}}" type="{{kind}}" value="{{record.get(name,'')|formdate}}" required {% if kind=='number' %}min="1"{% endif %}>{% endif %}</label>{% endfor %}<div class="buttons"><button class="btn" type="submit">{{action}} record</button><a href="{{url_for('listing',resource=resource)}}">Cancel</a></div></form>{% endblock %}
